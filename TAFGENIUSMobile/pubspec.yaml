name: tafgeniusmobile
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.9.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8
  lucide_icons: ^0.257.0

  # State management
  provider: ^6.1.2

  # Utils
  path_provider: ^2.1.4
  shared_preferences: ^2.2.0

  # Charts
  syncfusion_flutter_charts: ^31.2.12
  fl_chart: ^1.1.1

  # Firebase - versions compatibles avec Android
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  google_sign_in: ^6.1.5
  cloud_firestore: ^5.6.12


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo1.png
    - assets/logo2.png
    - assets/google_logo.png
